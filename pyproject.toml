[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synexian-agent"
version = "0.1.0"
description = "AI-powered software quality analysis CLI tool for comprehensive code evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Synexian Team", email = "contact@synexian.com"}
]
keywords = ["code-analysis", "quality", "cli", "ai", "static-analysis", "security", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    "click>=8.1.0",

    # AI Integration
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",

    # Code Analysis
    "radon>=6.0.1",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "bandit>=1.7.5",
    "safety>=3.0.0",
    "vulture>=2.11",
    "mccabe>=0.7.0",

    # AST Analysis
    "astroid>=3.0.0",

    # Testing Tools
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mutmut>=2.4.0",
    "coverage>=7.4.0",

    # Report Generation
    "Jinja2>=3.1.3",
    "markdown>=3.5.0",
    "pygments>=2.17.0",

    # Git Integration
    "GitPython>=3.1.41",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",

    # Utilities
    "pathspec>=0.12.0",
    "platformdirs>=4.2.0",
    "cachetools>=5.3.2",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",

    # Code Quality
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",

    # Documentation
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.0",

    # Development Tools
    "ipython>=8.20.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
aegis = "synexian.cli:app"
synexian = "synexian.cli:app"  # backward compat alias — will be removed in v1.0

[project.urls]
Homepage = "https://github.com/synexian/synexian-agent"
Documentation = "https://synexian.readthedocs.io"
Repository = "https://github.com/synexian/synexian-agent"
Issues = "https://github.com/synexian/synexian-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["synexian*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=synexian --cov-report=html --cov-report=term"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
]

# Aegis Project Configuration
# This config is used when Aegis analyzes its own codebase.
# It sets appropriate thresholds for a code-analysis tool
# (which is inherently more complex than typical application code).

analyzers:
  complexity:
    enabled: true
    thresholds:
      # Analyzer files are inherently complex — they walk ASTs,
      # compute metrics, and handle many edge cases. Thresholds
      # are relaxed slightly from the defaults.
      max_cyclomatic_complexity: 20      # default: 10
      average_cyclomatic_complexity: 8.0 # default: 5.0
      max_cognitive_complexity: 25       # default: 15
      max_nesting_depth: 6               # default: 4
      average_npath_complexity: 500.0    # default: 200

  security:
    enabled: true
    thresholds:
      critical_issues: 0
      high_issues: 5
    options:
      # The security analyzer itself uses subprocess to run bandit —
      # exclude its own internal tool-calling patterns from detection
      skip_files:
        - "tests/"

  style:
    enabled: true
    thresholds:
      max_line_length: 100
      violations_per_kloc: 20.0          # relaxed from default 10
      pep8_compliance_rate: 85.0         # relaxed from 92
      docstring_coverage: 50.0           # target we are working toward
      type_hint_coverage: 50.0           # target we are working toward

  architecture:
    enabled: true
    thresholds:
      solid_violations: 50               # relaxed — tool code is complex
      architectural_smells: 30           # relaxed
      average_lcom: 0.7                  # relaxed from 0.5
    options:
      use_ai_analysis: false             # disable AI for self-analysis (speed)

  edge_cases:
    enabled: true
    options:
      use_ai_analysis: false             # disable AI for self-analysis (speed)

  test_quality:
    enabled: true
    thresholds:
      code_coverage: 34.0               # current actual coverage
      test_file_count: 1                # at least one test file required

  cognitive_load:
    enabled: true
    thresholds:
      average_maintainability_index: 20.0  # relaxed — complex tool code
      average_readability_score: 80.0

  custom_rules:
    enabled: true
    rules_file: "config/custom_rules.yaml"

scoring:
  weights:
    security: 0.25
    complexity: 0.15
    architecture: 0.15
    test_quality: 0.15
    style: 0.08
    edge_cases: 0.10
    cognitive_load: 0.07
    custom_rules: 0.05

output:
  formats:
    - cli
    - json
    - html
  directory: "./synexian-reports"

# Files and patterns to exclude from analysis
exclude:
  patterns:
    - "**/tests/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/venv/**"
    - "**/.venv/**"
    - "**/htmlcov/**"
    - "**/synexian-reports/**"
    - "**/build/**"
    - "**/dist/**"
    - "**/*.egg-info/**"
    - "scripts/self_improve.py"   # exclude the self-improvement script itself
